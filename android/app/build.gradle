apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def hermesEnabled = true
def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

// ✅ Auto-generate Metro config if missing
def ensureMetroConfig = {
    def metroConfig = new File("$projectRoot/metro.config.js")
    if (!metroConfig.exists()) {
        metroConfig.text = '''const { getDefaultConfig } = require("expo/metro-config");
const config = getDefaultConfig(__dirname);
module.exports = config;
'''
        println "✅ Created metro.config.js automatically for EAS Build"
    }
}
ensureMetroConfig()

react {
    entryFile = file(
        ["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"]
            .execute(null, rootDir)
            .text
            .trim()
    )
    enableBundleCompression = false
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

android {
    namespace "com.mehroz2762.hashdex"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.1.12297006"

    defaultConfig {
        applicationId "com.mehroz2762.hashdex"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            shrinkResources false
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs.useLegacyPackaging false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ✅ Force React Native version to match Expo SDK
configurations.all {
    resolutionStrategy {
        force "com.facebook.react:react-native:0.79.6"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // ✅ Firebase dependencies (for Firestore, Auth, Storage, Messaging)
    implementation(platform("com.google.firebase:firebase-bom:33.3.0"))
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    implementation("com.google.firebase:firebase-storage")
    implementation("com.google.firebase:firebase-messaging")

    // ✅ Expo + React Native autolinked modules
    implementation project(":react-native-async-storage_async-storage")
    implementation project(":react-native-picker_picker")
    implementation project(":react-native-gesture-handler")
    implementation project(":react-native-pager-view")
    implementation project(":react-native-reanimated")
    implementation project(":react-native-safe-area-context")
    implementation project(":react-native-screens")
    implementation project(":react-native-share-menu")

    // ✅ Hermes engine (better performance)
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
}
