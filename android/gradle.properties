# ========================================================
# 🧩 Project-wide Gradle settings (android/gradle.properties)
# ========================================================

# JVM settings
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Enable parallel & caching builds for better speed
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX & Jetifier
android.useAndroidX=true
android.enableJetifier=true

# PNG crunching in release builds
android.enablePngCrunchInReleaseBuilds=true

# Supported architectures
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New architecture (TurboModules + Fabric)
# COMMENT THIS OUT - it's causing issues with your current setup
# newArchEnabled=true

# Hermes JavaScript engine
hermesEnabled=true

# Expo image options
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Packaging mode
expo.useLegacyPackaging=false

# Edge-to-edge layout
expo.edgeToEdgeEnabled=false

# Fix for autolinking issues
expo.autolinking.useCommunityAutolinking=false